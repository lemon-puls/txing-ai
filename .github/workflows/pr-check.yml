name: PR Check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go-lint-and-build:
    name: Go Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /dev/null cmd/main.go

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: static/frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: static/frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: static/frontend
        run: pnpm lint

      - name: Build check
        working-directory: static/frontend
        run: pnpm build
