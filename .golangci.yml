run:
  timeout: 5m

linters:
  enable:
    - errcheck      # 检查未处理的错误
    - gosimple      # 简化代码建议
    - govet         # Go vet 检查
    - ineffassign   # 检测无效赋值
    - staticcheck   # 静态分析
    - unused        # 检查未使用的代码
    - misspell      # 拼写检查
    - gocritic      # 代码风格检查

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

issues:
  exclude-rules:
    # 测试文件放宽限制
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
    # 生成的代码排除
    - path: api/generated/
      linters:
        - errcheck
        - gocritic
        - unused
  max-issues-per-linter: 50
  max-same-issues: 3
