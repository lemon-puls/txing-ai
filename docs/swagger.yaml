  /api/chat/ws:
    get:
      consumes:
      - application/json
      description: 建立用于实时聊天的 WebSocket 连接，支持发送聊天消息和停止生成。连接建立后，客户端可以发送聊天消息和停止指令，服务器会以流式响应的方式返回
        AI 回复
      parameters:
      - description: 会话ID
        in: query
        name: id
        required: true
        type: integer
      - description: 用户令牌
        in: query
        name: token
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols 切换到 WebSocket 协议
          schema:
            type: string
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 建立聊天 WebSocket 连接
      tags:
      - 聊天会话
      x-message-error:
        message: 错误信息
        type: error
      x-message-request:
        content: 聊天内容
        context: 1
        enableWeb: false
        frequency_penalty: 0
        max_tokens: 2048
        model: 模型标识
        presence_penalty: 0
        repetition_penalty: 1
        temperature: 1
        top_k: 50
        top_p: 0.7
        type: chat
      x-message-response:
        content: AI回复内容
        conversationId: 123
        end: false
        reasoning_content: 思考过程
      x-message-stop:
        type: stop
